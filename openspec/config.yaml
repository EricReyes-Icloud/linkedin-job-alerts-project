schema: spec-driven

context: |
  Tech stack: Google Apps Script (plain JavaScript, IIFE pattern)
  Architecture: Schedule-triggered pipeline — JSearch/RapidAPI fetch → URL dedup → Gemini AI scoring → Notion storage → Telegram alerts
  Integrations: JSearch via RapidAPI, Google Gemini (gemini-2.0-flash), Notion API, Telegram Bot API
  Persistence: Notion database for job records; Apps Script Properties Service for secrets
  Testing: Manual verification against live APIs; no unit test runner (Apps Script constraint)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Consider impact on LinkedIn rate limiting and API stability
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Account for external API unreliability (LinkedIn, Gemini 503s)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Note rate limiting constraints and retry patterns
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Validate workflow JSON structure before deployment
      - Test with small keyword sets before full run
      - Preserve rate limiting Wait nodes
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
